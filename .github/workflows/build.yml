name: Build Windows application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
      - uses: NuGet/setup-nuget@v2
      - run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 -Version 1.0.3 -OutputDirectory .ci-packages
      - shell: pwsh
        run: |
          $refs = Join-Path $PWD '.ci-packages/Microsoft.NETFramework.ReferenceAssemblies.net452.1.0.3/build'
          msbuild Saaty.sln /p:Configuration=Release "/p:TargetFrameworkRootPath=$refs"
